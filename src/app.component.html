
<main class="h-screen w-screen bg-zinc-950 text-zinc-100 flex items-center justify-center overflow-hidden p-4 md:p-8">
  <div class="w-full h-full max-w-6xl mx-auto bg-zinc-950 border border-zinc-800 rounded-2xl shadow-2xl shadow-black/50 overflow-hidden flex flex-col relative">
    
    <!-- Subtle background noise/gradient -->
    <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-5 pointer-events-none"></div>
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 z-50"></div>

    <div class="flex-1 overflow-hidden relative z-10 p-6 md:p-8">
      @if (store.viewMode() === 'wizard') {
        <app-wizard />
      } @else {
        <app-story-view />
      }
    </div>
    
  </div>
</main>
